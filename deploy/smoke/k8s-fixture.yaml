apiVersion: v1
kind: Namespace
metadata:
  name: pannier-smoke
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: canary
  namespace: pannier-smoke
data:
  note: pannier-smoke-canary
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pannier-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pannier-smoke
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
